# ============================================================
# Конфиг блога. Минимум, который нужно поменять под себя:
#   baseURL, title, [params] author/tagline/description
# ============================================================

baseURL = "https://bondurant84.github.io/bondurant84-blog/"
locale = "ru-RU"
defaultContentLanguage = "ru"
title = "Алексей Алёхин"
hasCJKLanguage = false
enableEmoji = true
timeZone = "Europe/Moscow"

theme = "signal"
enableRobotsTXT = true

[params]
  author = "Алексей Алёхин"
  tagline = "Изнанка мира боёв"
  description = "Шизо-мемуары, жестокие писатели и фильмы про ублюдков — блог об изнанке мира боёв."
  heroImage = "img/hero.jpg"

[menus]
  [[menus.main]]
    name = "Главная"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Кто я"
    pageRef = "/kto-ya"
    weight = 20
  [[menus.main]]
    name = "Блог"
    pageRef = "/blog"
    weight = 30
  [[menus.main]]
    name = "Now"
    pageRef = "/now"
    weight = 50
  [[menus.main]]
    name = "Библиотека"
    pageRef = "/biblioteka"
    weight = 60
  [[menus.main]]
    name = "Контакты"
    pageRef = "/kontakty"
    weight = 70

[taxonomies]
  tag = "tags"

[related]
  includeNewer = true
  threshold = 10
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"

[pagination]
  pagerSize = 20

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]